    <rect x="0" y="0" width="205" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.11" stroke="#B8DDE1" stroke-opacity="0.28" />
    <text x="102.5" y="30" text-anchor="middle" fill="#F4FAFA">Unstructured Inputs</text>

