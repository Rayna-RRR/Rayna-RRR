    <text x="68" y="151" fill="#FFFFFF" font-size="62" font-weight="750" letter-spacing="1">RAYNA</text>
    <text x="72" y="191" fill="#D7E9EB" font-size="23" font-weight="500" letter-spacing="1.5">AI PRODUCT · AGENT WORKFLOWS · EVALUATION</text>
  </g>

