    <path d="M244 18 L251 24 L244 30" fill="none" stroke="#B8A06A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="266" y="0" width="190" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.11" stroke="#B8DDE1" stroke-opacity="0.28" />
    <text x="361" y="30" text-anchor="middle" fill="#F4FAFA">Agent Workflow</text>

    <path d="M470 24 H502" stroke="#B8A06A" stroke-width="2.4" stroke-linecap="round" />
