<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Rayna — AI Product, Agent Workflows, and Evaluation</title>
  <desc id="desc">A dark teal profile banner showing an evidence-first AI product workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102B38" />
      <stop offset="0.55" stop-color="#1A3A4A" />
      <stop offset="1" stop-color="#21566A" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#4CA7AD" stop-opacity="0.32" />
      <stop offset="1" stop-color="#4CA7AD" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#071820" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)" />
  <rect width="1200" height="320" rx="24" fill="url(#glow)" />

  <g opacity="0.16" stroke="#D9F1F1" fill="none">
    <path d="M0 74 C190 8 330 138 510 76 S840 4 1200 88" />
    <path d="M0 258 C180 182 370 300 570 232 S930 166 1200 244" />
    <circle cx="1000" cy="72" r="118" />
    <circle cx="1000" cy="72" r="82" />
  </g>

